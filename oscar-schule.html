<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#111;font-family:"Trebuchet MS",Verdana,Arial,sans-serif;overflow:hidden}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}

.b{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;margin:0;line-height:1.15}
button.b{cursor:pointer;font-family:inherit;font-weight:700;padding:0 .5em;transition:transform .15s,opacity .3s;border-radius:calc(var(--u)*1.2);border:calc(var(--u)*.3) solid var(--ink)}
button.b:hover:not(:disabled),button.b:focus{transform:scale(1.06);outline:calc(var(--u)*.45) solid #facc15;outline-offset:calc(var(--u)*.15)}
.pri{background:var(--pri);color:#fff;border-color:var(--priDk)}.sec{background:var(--panel);color:var(--ink)}
.opt{background:var(--optbg);color:var(--optink);border-color:var(--accent)}
.opt.good{background:#16a34a!important;color:#fff!important;border-color:#fff}.opt.bad{background:#dc2626!important;color:#fff!important;border-color:#fff}
.tok{background:transparent center/contain no-repeat;border:0!important;padding:0!important;color:#fff;animation:bob 3s ease-in-out infinite;flex-direction:column;justify-content:flex-end}
.tok span{margin-bottom:var(--sm,-.6em)!important;background:rgba(0,0,0,.55);border-radius:calc(var(--u)*1);padding:0 .5em;font-size:calc(var(--u)*1.5);}
.tok.done{animation:none;filter:grayscale(1) brightness(.6);pointer-events:none}
.tok.fly{animation:none;transition:left 1.1s ease-in,top 1.1s ease-in,width 1.1s,height 1.1s,opacity 1.1s;z-index:9}
.tok.nope{animation:shake .5s}
.tok.gone{opacity:0;pointer-events:none}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-.7))}}
.pn{background:var(--panel);border:calc(var(--u)*.3) solid var(--accent);border-radius:calc(var(--u)*1.6);pointer-events:none}
.hud{background:rgba(20,20,40,.78);color:#fff;border-radius:calc(var(--u)*2);font-weight:700;border:calc(var(--u)*.2) solid var(--accent)}
.pop{animation:pop .5s ease-out}.shake{animation:shake .4s}.fade{animation:fd .4s}.spin{animation:sp 24s linear infinite;pointer-events:none}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
@keyframes fd{from{opacity:0}to{opacity:1}}@keyframes sp{to{transform:rotate(360deg)}}
.pt{position:absolute;pointer-events:none;border-radius:50%;background:var(--pc);box-shadow:0 0 8px var(--pc);animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.05;transform:scale(.6)}50%{opacity:.95;transform:translateY(-14px) scale(1.2)}}
.rise{animation:ri 7s linear infinite;top:104%}@keyframes ri{to{top:-6%;opacity:0}}
