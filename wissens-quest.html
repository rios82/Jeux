<title>Wissens-Quest</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#111;font-family:"Trebuchet MS",Verdana,Arial,sans-serif;overflow:hidden}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9));aspect-ratio:16/9;background:#222 center/100% 100% no-repeat;overflow:hidden}
.b{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;margin:0;line-height:1.15}
button.b{cursor:pointer;font-family:inherit;font-weight:700;padding:0 .5em;transition:transform .15s;border-radius:calc(var(--u)*1.2);border:calc(var(--u)*.3) solid var(--ink)}
button.b:hover,button.b:focus{transform:scale(1.06);outline:calc(var(--u)*.45) solid #facc15;outline-offset:calc(var(--u)*.15)}
.pri{background:var(--pri);color:#fff;border-color:var(--priDk)}
.sec{background:var(--panel);color:var(--ink)}
.pill{color:#fff;border-color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.card{background:var(--panel);color:var(--ink)}
.pn{background:var(--panel);border:calc(var(--u)*.3) solid var(--accent);border-radius:calc(var(--u)*1.6);pointer-events:none}
.hud{background:rgba(20,20,40,.78);color:#fff;border-radius:calc(var(--u)*2);font-weight:700;border:calc(var(--u)*.2) solid var(--accent)}
.pop{animation:pop .5s ease-out}.shake{animation:shake .4s}.fade{animation:fd .4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.pt{position:absolute;pointer-events:none}
.st{border-radius:50%;background:#fff;box-shadow:0 0 8px #ffe9a8;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.05;transform:scale(.6)}50%{opacity:.95;transform:translateY(-14px) scale(1.2)}}
.lf{border-radius:0 100% 0 100%;opacity:.85;top:-8%;animation:fall 10s linear infinite,spin 4s linear infinite}
@keyframes fall{to{top:104%}}@keyframes spin{to{rotate:360deg}}

  el(...F.e,2.1,'',ok?`„${q.o[q.c]}“ – ${q.e}`:`Richtig: „${q.o[q.c]}“ – ${q.e}`,`color:${F.ink||'var(--ink)'};justify-content:flex-start;text-align:left;font-weight:600`);
  el(...F.n,2.2,'pri',cur<N-1?'Nächste Frage ▶':'Ergebnis ▶').onclick=next;
  el(...F.bk,1.7,'sec','◀ Zurück').onclick=back;el(...F.h,1.7,'sec','Start').onclick=()=>{screen='home';render()};
  el(...T.hudPos,1.5,'hud',`Frage ${cur+1}/${N} · Punkte: ${sc}`)}
 tools();focus1()}
function answer(j){ans[cur]=j;j===QS[cur].c?ding():buzz();render()}
function next(){cur<N-1?cur++:screen='result';render()}
function back(){cur===0?screen='home':cur--;screen==='result'&&(screen='game');render()}
function result(){const s=score(),L=s>=6?T.res[0]:T.res[1];clear(L.bg);panel(L.panel);const[x,w]=L.col;
 el(x,L.y[0],w,8,3.2,'','ERGEBNIS','color:var(--ink2);font-weight:800');
 el(x,L.y[1],w,16,10,'pop',`${s} / ${N}`,'color:var(--ink);font-weight:800');
 el(x,L.y[2],w,8,3.4,'',s===N?'Superstar!':s>=6?'Sehr gut!':s>=4?'Gut gemacht!':'Noch einmal!','color:var(--pri);font-weight:800');
 el(x,L.y[3],w,6,2,'',`Du hast ${s} von ${N} Fragen richtig beantwortet.`,'color:var(--ink)');
 el(x+1,L.y[4],w*.55,9,2.4,'pri','↻ Nochmal').onclick=start;el(x+w*.58,L.y[4],w*.38,9,2,'sec','Start').onclick=()=>{screen='home';render()};
 s===N?fan():s>=4?ding():buzz();tools();focus1()}
addEventListener('keydown',e=>{const bs=[...S.querySelectorAll('button')].filter(b=>!/^(Ton|Musik)/.test(b.textContent)),i=bs.indexOf(document.activeElement);
 if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();(bs[i+1]||bs[0]).focus()}
 else if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();(bs[i-1]||bs[bs.length-1]).focus()}
 else if(['1','2','3','4'].includes(e.key)&&screen==='game'&&ans[cur]===undefined)answer(+e.key-1);
 else if((e.key==='n'||e.key===' ')&&screen==='game'&&ans[cur]!==undefined){e.preventDefault();next()}});
render();
</script></body></html>
