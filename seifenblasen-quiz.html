<title>Seifenblasen-Quiz</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#111;font-family:"Trebuchet MS",Verdana,Arial,sans-serif;overflow:hidden}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9));aspect-ratio:16/9;background:#222 center/100% 100% no-repeat;overflow:hidden}
.b{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;margin:0;line-height:1.15}
button.b{cursor:pointer;font-family:inherit;font-weight:700;padding:0 .5em;transition:transform .15s,opacity .3s;border-radius:calc(var(--u)*1.2);border:calc(var(--u)*.3) solid var(--ink)}
button.b:hover:not(:disabled),button.b:focus{transform:scale(1.06);outline:calc(var(--u)*.45) solid #facc15;outline-offset:calc(var(--u)*.15)}
.pri{background:var(--pri);color:#fff;border-color:var(--priDk)}.sec{background:var(--panel);color:var(--ink)}
.opt{background:var(--optbg);color:var(--optink);border-color:var(--accent)}
.opt.good{background:#16a34a!important;color:#fff!important;border-color:#fff}.opt.bad{background:#dc2626!important;color:#fff!important;border-color:#fff}
.tok{background:transparent center/contain no-repeat;border:0!important;padding:0!important;color:#fff;animation:bob 3s ease-in-out infinite;flex-direction:column;justify-content:flex-end}
.tok span{margin-bottom:var(--sm,-.6em)!important;background:rgba(0,0,0,.55);border-radius:calc(var(--u)*1);padding:0 .5em;font-size:calc(var(--u)*1.5);}
.tok.done{animation:none;filter:grayscale(1) brightness(.6);pointer-events:none}
.tok.fly{animation:none;transition:left 1.1s ease-in,top 1.1s ease-in,width 1.1s,height 1.1s,opacity 1.1s;z-index:9}
.tok.nope{animation:shake .5s}
.tok.gone{opacity:0;pointer-events:none}.tok .x{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:calc(var(--u)*5);color:#ef4444;text-shadow:0 2px 6px #000}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-.7))}}
.pn{background:var(--panel);border:calc(var(--u)*.3) solid var(--accent);border-radius:calc(var(--u)*1.6);pointer-events:none}
.hud{background:rgba(20,20,40,.78);color:#fff;border-radius:calc(var(--u)*2);font-weight:700;border:calc(var(--u)*.2) solid var(--accent)}
.pop{animation:pop .5s ease-out}.shake{animation:shake .4s}.fade{animation:fd .4s}.spin{animation:sp 24s linear infinite;pointer-events:none}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
@keyframes fd{from{opacity:0}to{opacity:1}}@keyframes sp{to{transform:rotate(360deg)}}
.pt{position:absolute;pointer-events:none;border-radius:50%;background:var(--pc);box-shadow:0 0 8px var(--pc);animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.05;transform:scale(.6)}50%{opacity:.95;transform:translateY(-14px) scale(1.2)}}
.rise{animation:ri 7s linear infinite;top:104%}@keyframes ri{to{top:-6%;opacity:0}}

const ctx=()=>ac=ac||new (window.AudioContext||window.webkitAudioContext)();
function note(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05)}

 else if(fx==='pop'){d.style.animation='none';d.style.transition='transform .4s ease-out,opacity .4s';d.style.transform='scale(1.7)';d.style.opacity=0;say(cx,cy);setTimeout(()=>{d.classList.add('gone');end()},650)}
 else if(fx==='reveal'){d.style.animation='none';d.style.transition='opacity .9s';d.style.opacity=0;say(cx,cy);setTimeout(()=>{d.classList.add('gone');end()},1000)}
 else{d.style.animation='none';d.style.backgroundImage=`url(${IMG.open[i]})`;d.classList.add('pop');say(cx,cy-6);setTimeout(()=>{d.disabled=true;end()},700)}}
function hub(){clear(G.hub.bg,G.hub.over);banner();const fx=G.hub.fx||'fly',fin=done()===N&&anim<0;
 function end(){if(done()===N){const e=E(36,84,28,9,2.6,'pri','Ergebnis ▶');e.onclick=()=>{screen='result';render()};e.focus({preventScroll:true})}}
 I.forEach((it,i)=>{const s=st[i],a=anim===i,d=E(it.x,it.y,it.w,it.h,1.5,'tok'+(s&&!a?' done':''),it.nolabel?'':`<span>${it.label||i+1}</span>`,`background-image:url(${(s==='ok'&&fx==='swap'&&!a)?IMG.open[i]:IMG.tok[i]});animation-delay:${-i*.4}s;${G.tokcss||''}`);
  const mark=()=>{d.classList.add('done');d.disabled=true;d.insertAdjacentHTML('beforeend','<b class="x">✘</b>')};

  else if(!s)d.onclick=()=>{cur=i;screen='question';whoosh();render()};
  if(a){anim=-1;setTimeout(()=>{if(st[i]==='ok'){ding();okfx(d,it,i,end)}else{buzz();d.classList.add('nope');setTimeout(()=>{mark();end()},520)}},80)}});
 hud();tools();if(fin)end();else focus1()}

 if(Q.card)E(...Q.card,0,'pn','');

 E(...Q.qr,Q.qpt,'',q.q,`color:var(--qink);font-weight:800;padding:0 1em`);
 q.o.forEach((t,j)=>{const b=E(...Q.opts[j],Q.opt,'opt'+(ans&&j===q.c?' good':'')+(ans&&j===pick&&j!==q.c?' bad':''),`<span style="opacity:.75;margin-right:.5em">${'ABCD'[j]}</span>${t}`);if(ans)b.disabled=true;else b.onclick=()=>choose(j)});
 if(ans){const ok=pick===q.c;E(...Q.msg,2.2,ok?'pop':'shake',`<div>`+(ok?'✔ RICHTIG!':'✘ FALSCH!')+`<br><small style="font-weight:600">${ok?'':'Richtig: „'+q.o[q.c]+'“ – '}${q.e}</small></div>`,`color:${ok?'#15803d':'#b91c1c'};font-weight:800;${Q.msgcss||''}`);
  E(...Q.next,2.2,'pri','Weiter ▶').onclick=()=>{anim=cur;screen='hub';render()}}
 else if(Q.cover)E(...Q.next,2,'sec','◀ Zurück').onclick=()=>{screen='hub';render()};else E(86.5,92.8,12,5.5,1.3,'sec','◀ Zurück').onclick=()=>{screen='hub';render()};
 hud();tools();focus1()}

 E(x,R.y[0],w,8,3.2,'','ERGEBNIS','color:var(--ink2);font-weight:800');E(x,R.y[1],w,16,10,'pop',`${s} / ${N}`,'color:var(--ink);font-weight:800');
 E(x,R.y[2],w,8,3.4,'',s===N?'Superstar!':s>=N*.75?'Sehr gut!':s>=N/2?'Gut gemacht!':'Noch einmal!','color:var(--pri);font-weight:800');
 E(x,R.y[3],w,6,2,'',`Du hast ${s} von ${N} Fragen richtig beantwortet.`,'color:var(--ink)');
 E(x+1,R.y[4],w*.55,9,2.4,'pri','↻ Nochmal').onclick=start;E(x+w*.58,R.y[4],w*.38,9,2,'sec','Start').onclick=()=>{screen='home';render()};
 s===N?fan():s>=N/2?ding():buzz();tools();focus1()}
addEventListener('keydown',e=>{const bs=[...S.querySelectorAll('button:not(:disabled)')].filter(b=>!/^(Ton|Musik)/.test(b.textContent)),i=bs.indexOf(document.activeElement);
 if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();(bs[i+1]||bs[0]).focus()}
